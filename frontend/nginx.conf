server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Roster spreadsheets and slide decks are uploaded through /api/.
    client_max_body_size 50m;

    # The pdf.js worker ships as .mjs; module workers need a JavaScript MIME type.
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        try_files $uri =404;
    }

    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-sent events (synced slides) must not be buffered or cut after 60 s.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
