[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/modules/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
australis-core = { path = "crates/core" }
australis-health = { path = "crates/modules/health" }

anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
