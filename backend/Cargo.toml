[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/modules/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Shared dependency versions. This file, Cargo.lock and every crate's Cargo.toml are
# frozen after the kernel package: feature packages add no dependencies.
[workspace.dependencies]
australis-core = { path = "crates/core" }
australis-auth = { path = "crates/modules/auth" }
australis-campus = { path = "crates/modules/campus" }
australis-classes = { path = "crates/modules/classes" }
australis-grades = { path = "crates/modules/grades" }
australis-health = { path = "crates/modules/health" }
australis-roster = { path = "crates/modules/roster" }
australis-slides = { path = "crates/modules/slides" }

anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
base64 = "0.22"
axum = { version = "0.8", features = ["multipart"] }
calamine = "0.38"
csv = "1"
ed25519-dalek = "2"
encoding_rs = "0.8"
futures = "0.3"
hex = "0.4"
http-body-util = "0.1"
lopdf = { version = "0.47", default-features = false }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Argon2 is very slow without optimisation; keep sign-in fast in debug builds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
