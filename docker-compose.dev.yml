# Development stack with hot reload.
# Run: docker compose -f docker-compose.dev.yml up --watch
name: australis-dev

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      UPLOAD_DIR: /uploads
      RUST_LOG: ${RUST_LOG:-debug,sqlx=warn}
      # An empty value means "use the default"; see .env.example.
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      ZOOM_PROVIDER: ${ZOOM_PROVIDER:-}
      ZOOM_ACCOUNT_ID: ${ZOOM_ACCOUNT_ID:-}
      ZOOM_CLIENT_ID: ${ZOOM_CLIENT_ID:-}
      ZOOM_CLIENT_SECRET: ${ZOOM_CLIENT_SECRET:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-}
    volumes:
      - australis-dev-data:/data
      - australis-dev-uploads:/uploads
      - australis-dev-target:/src/target
      - australis-dev-cargo:/usr/local/cargo/registry
    ports:
      - "8080:8080"
    develop:
      watch:
        - action: sync
          path: ./backend/crates
          target: /src/crates
        - action: sync
          path: ./backend/Cargo.toml
          target: /src/Cargo.toml
        - action: rebuild
          path: ./backend/Cargo.lock

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      API_URL: http://backend:8080
    depends_on:
      - backend
    ports:
      - "5173:5173"
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/vite.config.ts

volumes:
  australis-dev-data:
  australis-dev-uploads:
  australis-dev-target:
  australis-dev-cargo:
